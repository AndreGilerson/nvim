# Vale configuration shipped with this nvim config. Located by vale-ls via the
# VALE_CONFIG_PATH env var set in lua/config/writing.lua, so these rules apply
# to prose in any directory. Fetch the styles once with `vale sync` (run from
# this directory, or anywhere with VALE_CONFIG_PATH exported).
#
# StylesPath is relative to this file → <nvim-config>/vale/styles/ (gitignored;
# it holds downloaded rule packages).

StylesPath = styles

# suggestion < warning < error. Lower it to see every stylistic nudge.
MinAlertLevel = suggestion

# Style packages pulled by `vale sync`. write-good = passive voice, wordiness,
# weasel words, clichés; proselint = a broad prose style checker. For a more
# opinionated house voice, add Microsoft or Google here and to BasedOnStyles.
Packages = write-good, proselint

[*.{md,markdown,txt,tex,rst,adoc}]
BasedOnStyles = Vale, write-good, proselint
